aid: typelaw
name: TypeLaw
description: TypeLaw is an AI-powered legal document automation platform that formats
  and prepares court-compliant briefs for attorneys, paralegals, and law firms. Lawyers
  upload a draft brief and pick the court, and TypeLaw automatically produces a compliant
  PDF with tables of contents, tables of authorities, hyperlinked citations, cover
  pages, and certificates, with a human expert reviewing every document before delivery.
  A Bloomberg Beta portfolio company, TypeLaw delivers its product through its web
  application and does not currently publish a public developer API.
